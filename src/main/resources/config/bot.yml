# 机器人业务配置 —— 意图识别已迁移至 IntentClassifier（qwen-turbo LLM 驱动）
# 不再需要正则表达式配置，大幅简化维护。
# 对应配置类：BotProperties

bot:
  intent:
    # 意图正则已移除，分类由 IntentClassifier (qwen-turbo) 处理
    image-edit-system-prompt: |
      你是一个图片编辑助手。根据用户提供的原始图片和修改要求，
      用中文详细描述修改后图片的画面内容，包括颜色、构图、物体位置变化等。
      输出将直接作为文生图模型的提示词，请保证描述清晰具体。

  cache:
    pending-image-ttl-minutes: 5
    max-pending-images: 50
    cleanup-interval-minutes: 2

  file:
    max-size-mb: 20
    system-prompt-path: classpath:prompts/file-system.txt

  weather:
    # api-key: <see security.yml>
    base-url: https://restapi.amap.com/v3/weather/weatherInfo
